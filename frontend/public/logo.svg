<svg width="800" height="320" viewBox="0 0 800 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Car Silhouette -->
  <path d="M150 140 Q250 80, 400 100 Q500 110, 650 140 Q680 150, 700 180 L680 200 Q650 185, 600 180 Q500 175, 400 175 Q300 175, 200 180 Q150 185, 130 200 L150 140Z" fill="url(#silverGradient)" />
  <path d="M150 140 L200 160 Q300 150, 400 150 Q500 150, 600 160 L650 140" fill="#1A1A1A" opacity="0.7"/>

  <!-- Red Accent Swoosh -->
  <path d="M150 185 Q300 170, 500 175 Q600 178, 750 210" stroke="#D0202F" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M150 185 Q300 170, 500 175 Q600 178, 750 210" stroke="#FF2A3C" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Text: NEXTGEN CUSTOMS -->
  <text x="130" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" font-style="italic" fill="#D0202F" letter-spacing="8">NEXTGEN CUSTOMS</text>
  <text x="130" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" font-style="italic" fill="url(#textGradient)" letter-spacing="8">NEXTGEN CUSTOMS</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9CA3AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B5563;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D0202F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF2A3C;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
